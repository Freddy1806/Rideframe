<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>RIDEFRAME Vorschau</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#f4f4ef;font-family:Archivo,sans-serif}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.pv-top{position:fixed;left:24px;top:20px;display:flex;gap:12px;align-items:center}
.pv-top a{color:#f4f4ef;text-decoration:none;background:rgba(11,11,11,.6);padding:10px 16px;font-weight:700;font-size:14px}
.pv-top .tag{background:#ff5a1f;color:#0b0b0b;padding:10px 14px;font-weight:900;font-size:14px;letter-spacing:.06em}
.pv-info{position:fixed;right:24px;top:20px;background:rgba(11,11,11,.6);padding:12px 18px;text-align:right}
.pv-info .seg{font-weight:900;font-size:22px;text-transform:uppercase}
.pv-info .num{font-size:15px;opacity:.85;margin-top:4px;font-variant-numeric:tabular-nums}
.pv-bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75) 40%);padding:30px 24px 18px}
#prof{width:100%;height:90px;display:block;cursor:pointer}
.pv-ctl{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.pv-ctl button{background:rgba(244,244,239,.12);color:#f4f4ef;border:0;padding:8px 14px;font:700 13px Archivo,sans-serif;cursor:pointer}
.pv-ctl button.on{background:#ff5a1f;color:#0b0b0b}
.pv-ctl .hint{margin-left:auto;opacity:.6}
</style></head><body>
<canvas id="gl"></canvas>
<div class="pv-top"><a href="index.html">← Zurück</a><span class="tag">VORSCHAU</span><span id="rname" style="font-weight:900;font-size:18px"></span></div>
<div class="pv-info"><div class="seg" id="seg"></div><div class="num" id="num"></div></div>
<div class="pv-bar"><canvas id="prof"></canvas>
<div class="pv-ctl"><button id="play">▶ Abspielen</button><span style="opacity:.6;margin:0 4px 0 10px">Tempo</span><button data-s="10">10×</button><button data-s="30" class="on">30×</button><button data-s="60">60×</button><button data-s="120">120×</button>
<span class="hint">Mausrad oder Trackpad = vor/zurück · Klick ins Profil = springen · Leertaste = Play/Pause · ← → = 500 m</span></div></div>
<script type="module" src="js/world/preview.js"></script>
</body></html>
