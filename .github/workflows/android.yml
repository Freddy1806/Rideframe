# Builds the RIDEFRAME Android app (folder app/, Capacitor) and publishes the APK on the release "android-test".
# Test phase: signed with the runner's debug key, so a new build may need the old app removed before installing.
name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk RIDEFRAME.apk
      - name: APK veröffentlichen
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --title "RIDEFRAME Android (Test)" --notes "Testversion der Android-App. Auf dem Handy herunterladen und installieren." --prerelease
          gh release upload android-test RIDEFRAME.apk --clobber
