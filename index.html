<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIDEFRAME</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="wordmark"><svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="var(--accent)"/><path d="M6 24 L14 12 L19 18 L23 10 L27 24 Z" fill="#0b0b0b"/></svg>RIDEFRAME<button class="vertag" id="verTag" title="Version"></button></div>
    <nav class="tabs">
      <button class="tab" data-view="library">Strecken</button>
      <button class="tab" data-view="training">Training</button>
      <button class="tab" data-view="history">Fahrten &amp; Rekorde</button>
      <button class="tab" data-view="settings">Einstellungen</button>
    </nav>
    <div class="spacer"></div>
    <button class="pill" id="accPill" hidden><span class="dot"></span><span class="t">Anmelden</span></button>
    <button class="pill" id="hrPill"><span class="dot"></span><span class="t">Puls verbinden</span></button>
    <button class="pill" id="trainerPill"><span class="dot"></span><span class="t">KICKR verbinden</span></button>
  </header>
  <main id="main"></main>
</div>
<input type="file" id="fileInput" multiple accept="video/mp4,video/quicktime,.mp4,.MP4,.mov,.gpx,.rideframe,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
